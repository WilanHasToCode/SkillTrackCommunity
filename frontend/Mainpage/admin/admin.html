<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillTrack - Admin</title>
    <!-- Link CSS file -->
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">AD</div>
            <p class="role-label">ADMIN</p>
            <button class="nav-btn active" id="navRequests" onclick="showView('requests')">
                Reset Requests <span class="badge" id="badge">0</span>
            </button>
            <button class="nav-btn" id="navPosts" onclick="showView('posts')">Public Posts</button>
            <button class="nav-btn" onclick="logOut()">Log Out</button>
        </aside>

        <div class="content">

            <!-- Top bar -->
            <header class="top-bar">
                <h1 id="pageTitle">Password Reset Requests</h1>
                <span class="admin-tag">Admin account</span>
            </header>

            <main class="main">

                <!-- View 1: password reset requests -->
                <section id="requestsView">
                    <div id="requestList"></div>
                    <div class="card" id="noRequests">No reset requests.</div>
                </section>

                <!-- View 2: public posts the admin can remove -->
                <section id="postsView" class="hidden">
                    <div id="postList"></div>
                    <div class="card" id="noPosts">No public posts.</div>
                </section>

            </main>
        </div>
    </div>

    <!-- Request layout: JavaScript makes a copy of this for every request -->
    <template id="requestTemplate">
        <div class="card row">
            <div>
                <b class="req-user"></b>
                <div class="muted req-gmail"></div>
                <div class="muted req-time"></div>
            </div>
            <div class="row-right">
                <span class="tag"></span>
                <button class="btn act-btn"></button>
            </div>
        </div>
    </template>

    <!-- Post layout: JavaScript makes a copy of this for every post -->
    <template id="postTemplate">
        <div class="card">
            <div class="row">
                <div>
                    <b class="post-author"></b>
                    <span class="muted post-time"></span>
                </div>
                <button class="btn danger delete-btn">Remove post</button>
            </div>
            <p class="post-text"></p>
        </div>
    </template>

    <!-- Link JavaScript file -->
    <script src="admin.js"></script>
</body>
</html>
