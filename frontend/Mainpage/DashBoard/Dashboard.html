<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillTrack - Dashboard</title>
    <!-- Link CSS file -->
    <link rel="stylesheet" href="Dashboard.css">
</head>
<body>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">ST</div>
            <a href="Dashboard.html" class="nav-btn active">Dashboard</a>
            <a href="../profiles/profiles.html" class="nav-btn">Profile</a>
            <a href="../skills/skills.html" class="nav-btn">Skills Directory</a>
            <button class="nav-btn" onclick="logOut()">Log Out</button>
        </aside>

        <div class="content">

            <!-- Top bar -->
            <header class="top-bar">
                <h1>Community Dashboard</h1>
                <div class="top-right">
                    <button class="bell" id="bell" onclick="clearBell()" aria-label="Notifications">
                        🔔<span class="dot" id="dot"></span>
                    </button>
                    <div class="avatar" id="avatar">M</div>
                </div>
            </header>

            <main class="main">

                <!-- Community posts -->
                <section class="posts-area">
                    <div class="posts-head">
                        <h2>Community Posts</h2>
                        <button class="btn" onclick="openComposer()">Create Post</button>
                    </div>

                    <!-- Draft post box (hidden until Create Post is clicked) -->
                    <div class="card hidden" id="composer">
                        <h3 id="composerTitle">New post</h3>
                        <textarea id="postText" rows="3" placeholder="What are you learning?"></textarea>
                        <button class="btn" id="postBtn" onclick="savePost()">Post</button>
                        <button class="btn grey" onclick="closeComposer()">Cancel</button>
                    </div>

                    <!-- Posts are loaded from the backend by Dashboard.js -->
                    <div id="feed"></div>

                    <!-- Shown when there are no posts -->
                    <div class="card" id="emptyMessage">No posts yet. Click Create Post to write the first one.</div>
                    <div class="toast" id="toast" role="status" aria-live="polite"></div>
                </section>

                <!-- Profile card -->
                <aside class="profile-card card">
                    <h3>Profile</h3>
                    <p id="profileName">Username</p>
                    <a class="btn" href="../profiles/profiles.html">Update Profile</a>
                </aside>

            </main>
        </div>
    </div>

    <!-- Post layout: JavaScript makes a copy of this for every post -->
    <template id="postTemplate">
        <div class="card">
            <div class="post-top">
                <div class="post-avatar">M</div>
                <div>
                    <b>Member</b>
                    <div class="post-time"></div>
                </div>
            </div>
            <p class="post-text"></p>
            <div class="post-actions">
                <button class="action-btn like-btn"></button>
                <button class="action-btn edit-btn">Edit post</button>
            </div>
        </div>
    </template>

    <!-- Link JavaScript file -->
    <script src="../api.js"></script>
    <script src="Dashboard.js"></script>
</body>
</html>
