<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillTrack - Skills Directory</title>
    <!-- Link CSS files (Dashboard.css gives the shared layout) -->
    <link rel="stylesheet" href="../DashBoard/Dashboard.css">
    <link rel="stylesheet" href="skills.css">
</head>
<body>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">ST</div>
            <a href="../DashBoard/Dashboard.html" class="nav-btn">Dashboard</a>
            <a href="../profiles/profiles.html" class="nav-btn">Profile</a>
            <a href="skills.html" class="nav-btn active">Skills Directory</a>
            <button class="nav-btn" onclick="logOut()">Log Out</button>
        </aside>

        <div class="content">

            <!-- Top bar -->
            <header class="top-bar">
                <h1>Skills Directory</h1>
                <div class="top-right">
                    <div class="avatar">M</div>
                </div>
            </header>

            <main class="main">

                <!-- List of skills (added by skills.js) -->
                <section class="posts-area">
                    <div id="skillList"></div>

                    <section class="learning-workspace" id="learningWorkspace" hidden aria-live="polite">
                        <div class="learning-heading">
                            <div>
                                <p class="eyebrow">Learn</p>
                                <h2 id="learningTitle"></h2>
                                <p id="learningProgress"></p>
                            </div>
                            <button type="button" class="btn grey" id="closeLearningBtn">Back to skills</button>
                        </div>
                        <div id="learningMessage" class="learning-message" role="status"></div>
                        <div id="moduleList" class="module-list"></div>
                        <article id="moduleView" class="module-view" hidden></article>
                        <section id="assessmentView" class="assessment-view" hidden></section>
                    </section>
                </section>

                <!-- Right side panels -->
                <aside class="side-panel">

                    <!-- Skill details -->
                    <div class="card dark">
                        <h3 id="skillName">Skill Details</h3>
                        <p id="skillInfo">Click a skill to see its details.</p>
                        <button class="btn full" id="practiceSkillBtn" onclick="practiceSkill()">Learn / Practice</button>
                        <button class="btn grey full" onclick="shareSkill()">Share and post</button>
                    </div>

                    <!-- Track progress -->
                    <div class="card">
                        <h3>Progress</h3>
                        <p id="overallText">Overall: 0%</p>
                        <div class="bar"><i class="bar-fill" id="overallBar"></i></div>
                    </div>

                    <a class="btn grey full" href="../DashBoard/Dashboard.html">Return to Dashboard</a>
                </aside>

            </main>
        </div>
    </div>

    <!-- Skill layout: JavaScript makes a copy of this for every skill -->
    <template id="skillTemplate">
        <section class="skill-category">
            <h2 class="category-name"></h2>
            <div class="category-skills"></div>
        </section>
    </template>

    <template id="skillCardTemplate">
        <div class="card skill">
            <div class="skill-row">
                <b class="skill-name"></b>
                <span class="tag"></span>
            </div>
            <div class="bar"><i class="bar-fill"></i></div>
        </div>
    </template>

    <!-- Link JavaScript file -->
    <script src="../../src/api.js"></script>
    <script src="skills.js"></script>
</body>
</html>
