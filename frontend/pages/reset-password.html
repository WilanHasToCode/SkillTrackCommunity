<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>SkillTrack - Reset Password</title>
    <link rel="stylesheet" href="../src/Main.css">
</head>
<body>
    <main class="auth-container">
        <h2>Reset your password</h2>
        <div class="input-group">
            <label for="newPasswordInput">New password</label>
            <input id="newPasswordInput" type="password" minlength="12" maxlength="128"
                   autocomplete="new-password" placeholder="At least 12 characters">
        </div>
        <button class="btn-submit" id="resetPasswordBtn">Save new password</button>
        <p class="error-box" id="resetResult" role="status" aria-live="polite"></p>
        <a class="forgot-link" href="../Main.html">Return to login</a>
    </main>
    <script src="../src/api.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
