<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>SkillTrack - Reset Password</title>
    <link rel="stylesheet" href="../src/Main.css">
</head>
<body>
    <main class="auth-container reset-mode">
        <section class="auth-brand" aria-hidden="true">
            <div>
                <div class="brand-mark">ST</div>
                <h1>Keep building.</h1>
                <p>Secure your account and get back to learning.</p>
            </div>
        </section>
        <section class="auth-form">
            <p class="eyebrow">Account security</p>
            <h2>Reset your password</h2>
            <p class="auth-subtitle">Choose a strong password with at least 12 characters.</p>
            <div class="input-group">
                <label for="newPasswordInput">New password</label>
                <input id="newPasswordInput" type="password" minlength="12" maxlength="128"
                       autocomplete="new-password" placeholder="At least 12 characters">
            </div>
            <button class="btn-submit" id="resetPasswordBtn" type="button">Save new password</button>
            <p class="error-box" id="resetResult" role="status" aria-live="polite"></p>
            <a class="forgot-link" href="../Main.html">Return to login</a>
        </section>
    </main>
    <script src="../src/api.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
