<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillTrack - Login / Register</title>
    <!-- Link CSS file -->
    <link rel="stylesheet" href="src/Main.css">
</head>
<body>

    <div class="auth-container">
        <h2>SkillTrackCommunity</h2>

        <!-- Error Message  -->
        <div class="error-box" id="errorBox">
            Invalid username or password. Please try again.
        </div>

        <!-- Tabs -->
        <div class="tab-buttons">
            <button class="tab-btn active" id="loginTab">Log In</button>
            <button class="tab-btn" id="signupTab">Sign Up</button>
        </div>

        <!-- Login Form  -->
        <div class="input-group">
            <label id="usernameLabel">Username</label>
            <input type="text" id="userInput" placeholder="Type Username">
        </div>

        <div class="input-group hidden" id="emailGroup">
            <label for="emailInput">Email</label>
            <input type="email" id="emailInput" placeholder="you@example.com">
        </div>

        <div class="input-group">
            <label for="passInput">Password</label>
            <input type="password" id="passInput" placeholder="Password">
        </div>

        <button class="btn-submit" id="submitBtn">Log In</button>

        <a href="#" class="forgot-link" id="forgotLink">Forgot Password?</a>

        <div class="input-group hidden" id="resetRequestBox">
            <label for="resetEmailInput">Account email</label>
            <input id="resetEmailInput" type="email" placeholder="you@example.com" autocomplete="email">
            <button class="btn-submit" id="requestResetBtn">Send reset link</button>
            <button class="btn-submit" id="cancelResetBtn" type="button">Back to login</button>
            <p class="error-box" id="resetMessage" role="status" aria-live="polite"></p>
        </div>
    </div>

    <!-- Link JavaScript  Mainfile -->
    <script src="src/api.js"></script>
    <script src="src/Main.js"></script>
</body>
</html>
